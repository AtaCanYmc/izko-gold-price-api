name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Build sdist and wheel packages
        run: python -m build

      - name: Verify Python bytecode compilation
        run: python -m py_compile src/izko_gold_price_api/__init__.py src/izko_gold_price_api/__main__.py src/izko_gold_price_api/app.py src/izko_gold_price_api/cli.py src/izko_gold_price_api/mcp.py src/izko_gold_price_api/scrape.py

      - name: Verify config.json schema and package imports
        run: |
          python -c "
          from izko_gold_price_api import app, build_parser, handle_mcp_request, load_config, main, to_float

          cfg = load_config()
          assert 'url' in cfg and 'label' in cfg and 'api' in cfg
          assert cfg['api']['debug'] is False
          assert to_float('23.450,75') == 23450.75
          assert to_float('14:30:00') == '14:30:00'

          from izko_gold_price_api.scrape import clear_cache, close_browser, scrape
          import os, sys, types

          err_payload, err_status = scrape(url='file:///etc/passwd')
          assert err_status == 400 and err_payload['code'] == 'INVALID_URL'
          timeout_payload, timeout_status = scrape(timeout=999999)
          assert timeout_status == 400 and timeout_payload['code'] == 'INVALID_TIMEOUT'

          os.environ['IZKO_HOST'] = '0.0.0.0'
          os.environ['IZKO_PORT'] = '9090'
          os.environ['IZKO_DEBUG'] = 'true'
          os.environ['IZKO_TIMEOUT'] = '15000'
          os.environ['IZKO_CACHE_TTL'] = '45'
          env_cfg = load_config()
          assert env_cfg['api']['host'] == '0.0.0.0'
          assert env_cfg['api']['port'] == 9090
          assert env_cfg['api']['debug'] is True
          assert env_cfg['url']['timeout'] == 15000
          assert env_cfg['url']['cache_ttl'] == 45
          for k in ('IZKO_HOST', 'IZKO_PORT', 'IZKO_DEBUG', 'IZKO_TIMEOUT', 'IZKO_CACHE_TTL'):
              os.environ.pop(k, None)

          parser = build_parser()
          args = parser.parse_args(['serve', '--host', '0.0.0.0', '--port', '8080', '--no-debug'])
          assert args.command == 'serve' and args.host == '0.0.0.0' and args.port == 8080 and args.debug is False
          assert parser.parse_args(['mcp']).command == 'mcp'
          assert main(['config']) == 0

          init_resp = handle_mcp_request({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {}}, cfg=cfg)
          assert init_resp['result']['serverInfo']['name'] == 'izko-gold-price-api'
          tools_resp = handle_mcp_request({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}, cfg=cfg)
          assert len(tools_resp['result']['tools']) == 2
          call_resp = handle_mcp_request({'jsonrpc': '2.0', 'id': 3, 'method': 'tools/call', 'params': {'name': 'get_izko_config'}}, cfg=cfg)
          assert call_resp['result']['isError'] is False

          client = app.test_client()
          resp = client.get('/izko')
          assert resp.status_code == 200
          data = resp.get_json()
          assert data['endpointList']['bundle'] == '/izko/bundle'
          "

      - name: Verify essential governance files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md pyproject.toml; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done

      - name: Validate internal documentation links
        run: |
          python -c '
          import re, glob, os

          def check_file(f):
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              broken = []
              for link in links:
                  link = link.strip()
                  if not link or link.startswith("#"): continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")
              return broken

          all_broken = []
          for f in glob.glob("**/*.md", recursive=True):
              all_broken.extend(check_file(f))

          if all_broken:
              print("Error: Broken internal documentation links detected:")
              for b in all_broken:
                  print("  -", b)
              exit(1)
          print("Internal documentation links verified.")
          '
