name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: python -m py_compile app.py scrape.py

      - name: Verify config.json schema and parser logic
        run: |
          python -c "
          import json
          from app import app
          from scrape import to_float

          with open('config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          assert 'url' in cfg and 'label' in cfg and 'api' in cfg
          assert to_float('23.450,75') == 23450.75
          assert to_float('14:30:00') == '14:30:00'

          client = app.test_client()
          resp = client.get('/izko')
          assert resp.status_code == 200
          data = resp.get_json()
          assert data['endpointList']['bundle'] == '/izko/bundle'
          "

      - name: Verify essential governance files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done

      - name: Validate internal documentation links
        run: |
          python -c '
          import re, glob, os

          def check_file(f):
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              broken = []
              for link in links:
                  link = link.strip()
                  if not link or link.startswith("#"): continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")
              return broken

          all_broken = []
          for f in glob.glob("**/*.md", recursive=True):
              all_broken.extend(check_file(f))

          if all_broken:
              print("Error: Broken internal documentation links detected:")
              for b in all_broken:
                  print("  -", b)
              exit(1)
          print("Internal documentation links verified.")
          '
