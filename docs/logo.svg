<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="izko-gold-price-api logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1A160B"/>
    </linearGradient>
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="30%" stop-color="#F5C84C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7114"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#78560B"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B83B"/>
      <stop offset="100%" stop-color="#FFF6C4"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#F5C84C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5C84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Square Container -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bgGrad)" stroke="url(#goldPrimary)" stroke-width="4" stroke-opacity="0.55"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#F5C84C" stroke-width="1" stroke-opacity="0.16"/>

  <!-- Subtle Technical Grid & Ambient Glow -->
  <circle cx="256" cy="228" r="210" fill="url(#ambientGlow)"/>
  <g stroke="#F5C84C" stroke-opacity="0.06" stroke-width="1">
    <line x1="64" y1="148" x2="448" y2="148"/>
    <line x1="64" y1="228" x2="448" y2="228"/>
    <line x1="64" y1="308" x2="448" y2="308"/>
    <line x1="176" y1="64" x2="176" y2="384"/>
    <line x1="256" y1="64" x2="256" y2="384"/>
    <line x1="336" y1="64" x2="336" y2="384"/>
  </g>

  <!-- Left & Right API Brace Accents -->
  <path d="M116 146 C96 146 92 158 92 176 L92 204 C92 218 82 228 68 228 C82 228 92 238 92 252 L92 280 C92 298 96 310 116 310"
        fill="none" stroke="url(#goldPrimary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M396 146 C416 146 420 158 420 176 L420 204 C420 218 430 228 444 228 C430 228 420 238 420 252 L420 280 C420 298 416 310 396 310"
        fill="none" stroke="url(#goldPrimary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Isometric Gold Bullion Prism -->
  <g transform="translate(0, -6)">
    <!-- Top Face -->
    <polygon points="256,108 358,162 256,216 154,162" fill="url(#goldLight)" stroke="#FFF7CC" stroke-width="1.5"/>
    <!-- Inner Ingot Stamp -->
    <polygon points="256,126 326,162 256,198 186,162" fill="none" stroke="#9A7114" stroke-width="2" stroke-opacity="0.55"/>
    <!-- Left Face -->
    <polygon points="154,162 256,216 256,304 138,240" fill="url(#goldPrimary)"/>
    <!-- Right Face -->
    <polygon points="358,162 256,216 256,304 374,240" fill="url(#goldDark)"/>
    <!-- Center Ridge Highlight -->
    <line x1="256" y1="216" x2="256" y2="304" stroke="#FFF4B8" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Outer Silhouette Border -->
    <polygon points="256,108 358,162 374,240 256,304 138,240 154,162" fill="none" stroke="#FFE98A" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Live Ticker Sparkline Node Overlay -->
  <g>
    <polyline points="148,338 202,338 228,318 262,348 296,310 364,310"
              fill="none" stroke="url(#goldPrimary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="148" cy="338" r="5" fill="#F5C84C"/>
    <circle cx="296" cy="310" r="5" fill="#FFF0A8"/>
    <circle cx="364" cy="310" r="6" fill="#FFF0A8" stroke="#0B0F17" stroke-width="2"/>
  </g>

  <!-- Bottom Typography Badge -->
  <text x="256" y="408" text-anchor="middle" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="800" letter-spacing="6">İZKO</text>
  <text x="256" y="444" text-anchor="middle" fill="#D4AF37" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="4.5">GOLD PRICE API</text>
</svg>
